<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keep My Note</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1>Keep My Note</h1>
      <p class="subtitle">Simple client-side notes</p>
    </div>
    <div class="toolbar">
      <input
        id="searchInput"
        type="search"
        placeholder="Search notes..."
        aria-label="Search notes"
        autocomplete="off"
      />
      <button id="newNoteBtn" class="btn primary">+ New Note</button>
    </div>
  </header>

  <main class="container">
    <div id="notesGrid" class="notes-grid" aria-live="polite"></div>
    <div id="emptyState" class="empty-state" hidden>
      <p>No notes yet.</p>
      <p class="muted">Click “+ New Note” to create your first note. All data stays in your browser.</p>
    </div>
    <div id="noResults" class="empty-state" hidden>
      <p>No matching notes.</p>
      <p class="muted">Try a different search term.</p>
    </div>
  </main>

  <div id="editorOverlay" class="overlay" hidden>
    <div class="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <h2 id="editorTitle">New Note</h2>
      <label class="field">
        <span>Title</span>
        <input id="noteTitle" type="text" maxlength="100" placeholder="Note title" />
      </label>
      <label class="field">
        <span>Content</span>
        <textarea id="noteContent" rows="8" placeholder="Write your note..."></textarea>
      </label>
      <div class="editor-actions">
        <button id="cancelBtn" class="btn">Cancel</button>
        <button id="saveBtn" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
